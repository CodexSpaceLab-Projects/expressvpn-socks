services:
  expressvpn:
    image: ${IMAGE:-ghcr.io/codexspacelab-projects/expressvpn-socks:latest}
    build: .
    init: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
      - "${SOCKS_BIND:-0.0.0.0}:${SOCKS_PORT:-1080}:1080"
    environment:
      SOCKS_USER: ${SOCKS_USER:-proxy}
      SOCKS_PASSWORD_FILE: /run/secrets/socks-password
      SOCKS_PUBLISHED_PORT: ${SOCKS_PORT:-1080}
      SOCKS_DNS: ${SOCKS_DNS:-}
    secrets:
      - socks-password
    volumes:
      - expressvpn-settings:/opt/expressvpn/etc
      - expressvpn-data:/opt/expressvpn/var

secrets:
  socks-password:
    file: ./.secrets/socks-password

volumes:
  expressvpn-settings:
  expressvpn-data:
