name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-image
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/codexspacelab-projects/expressvpn-socks
      VERSION: '14.3.1'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .

      - name: Push image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"

          # Only the current main commit can update the shared tags.
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "$main_ref" == "$GITHUB_SHA"$'\t'refs/heads/main ]]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
